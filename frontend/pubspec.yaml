name: college_carpool
description: A new Flutter project for College Carpooling.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  
  # Networking
  dio: ^5.3.2
  web_socket_channel: ^2.4.0
  
  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^8.0.0
  
  # UI & Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # Utils
  uuid: ^4.0.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.2
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
